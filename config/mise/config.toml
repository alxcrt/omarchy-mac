[settings]
# pipx-backend tools install through mise's own uv (no standalone pipx/uv)
pipx.uvx = true
# Track today's releases. mise's release-age cooldown otherwise holds the AI
# CLIs days behind. This used to be MISE_MINIMUM_RELEASE_AGE=0 in every update
# path (mup, macup, mac, mise-install); one setting now covers them all,
# including a plain `mise up` typed by hand.
minimum_release_age = "0"
# Upstream Omarchy: an upgrade must not delete the version a running claude or
# codex session executes from. mise's auto-prune did, 24h after each upgrade.
# macup prunes instead, skipping any version a live process has open.
upgrade.auto_prune = false

[tools]
# Runtimes
node = "latest"
go = "latest"
rust = "latest"
bun = "latest"
uv = "latest"

# Local LLMs on Apple Silicon (mlx_lm.chat / .generate / .server)
"pipx:mlx-lm" = "latest"

# Hermes Agent (NousResearch) — official PyPI package, not the npm bridge
"pipx:hermes-agent" = "latest"

# AI CLIs + gh — migrated off Homebrew into mise so `mup`/`macup` bump them.
# All floated at "latest"; minimum_release_age = "0" (above) makes every
# update track today's release, not last week's.
claude = "latest"
# codex via npm, NOT the registry shortname (aqua:openai/codex): aqua's version
# list for this repo is broken — it enumerates alphas but no stable 0.153.x, so
# `mise up` resolves "latest" to an older release than codex's own updater
# reports. npm's dist-tag is the vendor's channel and is instant.
"npm:@openai/codex" = "latest"
opencode = "latest"
gh = "latest"

# From your Linux config
# grok: the official x.ai binary (mise registry `grok` = http:grok), as
# upstream switched to. The npm package only launches whatever sits in
# ~/.grok/bin, and mise skips its postinstall, so it stayed on 1.0.5 while
# mise reported 1.0.46.
grok = "latest"
"github:can1357/oh-my-pi" = "latest"
# pi as Omarchy ships it (badlogic/pi-mono, Mario Zechner) — NOT mise's
# registry `pi` shortname, which resolves to the unrelated earendil-works/pi.
"github:badlogic/pi-mono" = "latest"

# bcode (browser-use/browsercode) — replaced its curl installer (~/.bcode)
"github:browser-use/browsercode" = "latest"

# Browser automation CLI for AI agents (was an nvm-era npm global)
"npm:agent-browser" = "latest"

# More of upstream Omarchy's agent CLIs (install/user/mise.sh), same backends:
crush = "latest"                 # Charm's coding agent
antigravity-cli = "latest"       # Google's Antigravity CLI (command: agy; replaced gemini)
copilot = "latest"               # GitHub Copilot CLI
# ghui: terminal UI for GitHub pull requests. mise's supply-chain guard blocks
# npm packages under 1000 weekly downloads; approved after checking (Oct 2026):
# sole maintainer kitlangton (Kit Langton), repo github.com/kitlangton/ghui,
# the same package upstream installs. The guard stays on for everything else.
"npm:@kitlangton/ghui" = { version = "latest", allow_low_downloads = true }
"npm:playwright" = "latest"      # browser automation for agents
"npm:cf" = "latest"              # Cloudflare's CLI (beta). NOT mise's bare `cf`, which is Cloud Foundry

# Terminal workspace manager (herdr.dev = github.com/herdrdev/herdr).
# Ships a herdr-macos-aarch64 release binary, so it stays in the update path.
"github:herdrdev/herdr" = "latest"

# hunk: the diff viewer hds runs in its diff pane (`hunk diff --watch`).
hunk = "latest"

# Dev CLIs moved off Homebrew (Oct 2026). awscli by its registry alias, so the
# both-layers test matches brew's formula of the same name; exercism has no
# registry entry, so it comes from its GitHub releases.
awscli = "latest"
glab = "latest"
"github:exercism/cli" = "latest"
