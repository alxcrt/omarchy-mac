# ~/.config/aerospace/aerospace.toml
# Omarchy's window management ported to macOS via AeroSpace.
# SUPER = Caps Lock, mapped by Karabiner to ctrl+opt+cmd (see karabiner.json).
# Shift stays free, so Super+Shift+key works. Plain ⌥ is left alone for Ghostty
# splits and macOS special characters. Super+Ctrl+key binds (system panels)
# remain on plain ⌥⌃ — they do not need Caps Lock.
# Docs: https://nikitabobko.github.io/AeroSpace/guide
config-version = 2

start-at-login = true

on-focus-changed = ['move-mouse window-lazy-center']
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
automatically-unhide-macos-hidden-apps = false

[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.bottom     = 8
outer.top        = 8
outer.right      = 8

[mode.main.binding]
# ── Windows (Omarchy: Super+W / T / J / L / F) ──
ctrl-alt-cmd-w = 'close'                                    # close window
ctrl-alt-shift-cmd-w = 'close-all-windows-but-current'      # closest to "close all"
ctrl-alt-cmd-t = 'layout floating tiling'                   # toggle tiling/floating
ctrl-alt-cmd-j = 'layout tiles horizontal vertical'         # toggle window position
ctrl-alt-cmd-l = 'layout tiles accordion'                   # toggle layout style
ctrl-alt-cmd-f = 'fullscreen'                               # go full screen

# ── Focus / swap (Super+Arrow, Super+Shift+Arrow) ──
ctrl-alt-cmd-left  = 'focus left'
ctrl-alt-cmd-right = 'focus right'
ctrl-alt-cmd-up    = 'focus up'
ctrl-alt-cmd-down  = 'focus down'
ctrl-alt-shift-cmd-left  = 'move left'
ctrl-alt-shift-cmd-right = 'move right'
ctrl-alt-shift-cmd-up    = 'move up'
ctrl-alt-shift-cmd-down  = 'move down'

# ── Workspaces (Super+1-9, Super+Tab, Super+Ctrl+Tab) ──
ctrl-alt-cmd-1 = 'workspace 1'
ctrl-alt-cmd-2 = 'workspace 2'
ctrl-alt-cmd-3 = 'workspace 3'
ctrl-alt-cmd-4 = 'workspace 4'
ctrl-alt-cmd-5 = 'workspace 5'
ctrl-alt-cmd-6 = 'workspace 6'
ctrl-alt-cmd-7 = 'workspace 7'
ctrl-alt-cmd-8 = 'workspace 8'
ctrl-alt-cmd-9 = 'workspace 9'
ctrl-alt-cmd-tab = 'workspace next'
ctrl-alt-shift-cmd-tab = 'workspace prev'
alt-ctrl-tab = 'workspace-back-and-forth'          # former workspace

# ── Move window to workspace (Super+Shift+1-9) ──
ctrl-alt-shift-cmd-1 = 'move-node-to-workspace 1 --focus-follows-window'
ctrl-alt-shift-cmd-2 = 'move-node-to-workspace 2 --focus-follows-window'
ctrl-alt-shift-cmd-3 = 'move-node-to-workspace 3 --focus-follows-window'
ctrl-alt-shift-cmd-4 = 'move-node-to-workspace 4 --focus-follows-window'
ctrl-alt-shift-cmd-5 = 'move-node-to-workspace 5 --focus-follows-window'
ctrl-alt-shift-cmd-6 = 'move-node-to-workspace 6 --focus-follows-window'
ctrl-alt-shift-cmd-7 = 'move-node-to-workspace 7 --focus-follows-window'
ctrl-alt-shift-cmd-8 = 'move-node-to-workspace 8 --focus-follows-window'
ctrl-alt-shift-cmd-9 = 'move-node-to-workspace 9 --focus-follows-window'

# ── Move window to workspace WITHOUT following (Super+Shift+Alt+1-9) ──
alt-shift-ctrl-1 = 'move-node-to-workspace 1'
alt-shift-ctrl-2 = 'move-node-to-workspace 2'
alt-shift-ctrl-3 = 'move-node-to-workspace 3'
alt-shift-ctrl-4 = 'move-node-to-workspace 4'
alt-shift-ctrl-5 = 'move-node-to-workspace 5'
alt-shift-ctrl-6 = 'move-node-to-workspace 6'
alt-shift-ctrl-7 = 'move-node-to-workspace 7'
alt-shift-ctrl-8 = 'move-node-to-workspace 8'
alt-shift-ctrl-9 = 'move-node-to-workspace 9'

# ── Resize (Super+Minus/Equal, Super+Alt = smaller steps) ──
ctrl-alt-cmd-minus = 'resize smart -50'
ctrl-alt-cmd-equal = 'resize smart +50'
alt-ctrl-minus = 'resize smart -10'
alt-ctrl-equal = 'resize smart +10'
ctrl-alt-cmd-r = 'mode resize'

# ── Launching apps (Omarchy: Super+Return, Super+Shift+<key>) ──
# New WINDOW in the existing Ghostty (not `open -na`, which spawns a whole new
# app instance and litters the Dock with duplicate icons).
ctrl-alt-cmd-enter = '''exec-and-forget osascript -e 'tell application "Ghostty" to activate' -e 'tell application "System Events" to keystroke "n" using command down' '''
ctrl-alt-shift-cmd-enter = '''exec-and-forget osascript -e 'tell application "Google Chrome" to make new window' -e 'tell application "Google Chrome" to activate' '''
alt-shift-ctrl-b = '''exec-and-forget osascript -e 'tell application "Google Chrome" to make new window with properties {mode:"incognito"}' -e 'tell application "Google Chrome" to activate' '''
alt-ctrl-enter = 'exec-and-forget ghostty-run herdr'             # agent manager
ctrl-alt-shift-cmd-n = 'exec-and-forget ghostty-run nvim'                 # editor
ctrl-alt-shift-cmd-o = 'exec-and-forget open -a Obsidian'                                # Obsidian
ctrl-alt-cmd-d = 'exec-and-forget ghostty-run lazydocker'                  # Docker (moved off ⌥⇧D so Chrome's Download Video extension gets it)
ctrl-alt-shift-cmd-m = 'exec-and-forget ghostty-run cliamp'               # music
ctrl-alt-shift-cmd-a = 'exec-and-forget open -a ChatGPT'                                 # AI
ctrl-alt-shift-cmd-slash = 'exec-and-forget open -a "1Password"'                         # passwords
ctrl-alt-shift-cmd-f = 'exec-and-forget open -a Finder'                                  # file manager

# ── System (Omarchy: Super+Ctrl+<key> panels) ──
alt-ctrl-t = 'exec-and-forget ghostty-run btop'                   # activity
alt-ctrl-q = 'exec-and-forget open -a Calculator'                                # calculator
alt-ctrl-s = 'exec-and-forget open -a LocalSend'                                 # share
alt-ctrl-a = 'exec-and-forget open x-apple.systempreferences:com.apple.Sound-Settings.extension'
alt-ctrl-b = 'exec-and-forget open x-apple.systempreferences:com.apple.BluetoothSettings'
alt-ctrl-w = 'exec-and-forget open x-apple.systempreferences:com.apple.wifi-settings-extension'
alt-ctrl-d = 'exec-and-forget open x-apple.systempreferences:com.apple.Displays-Settings.extension'
alt-ctrl-p = 'exec-and-forget open x-apple.systempreferences:com.apple.Battery-Settings.extension'
alt-ctrl-l = 'exec-and-forget pmset displaysleepnow'                             # lock screen

# ── Web flows ──
# Alt+Shift+D (download) and Alt+Shift+L (copy URL) are owned by the Chrome
# extensions themselves, exactly as upstream. AeroSpace must NOT bind them:
# it grabs keys globally and the extension would never see the keypress.
# Use the CLI equivalents outside the browser: `webdl` / `weburl` (or mac dl/url).

# ── Reload ──
ctrl-alt-shift-cmd-c = 'reload-config'

[mode.resize.binding]
left  = 'resize width -50'
right = 'resize width +50'
down  = 'resize height +50'
up    = 'resize height -50'
minus = 'resize smart -50'
equal = 'resize smart +50'
enter = 'mode main'
esc = 'mode main'

# --- Auto-float utility/dialog/media windows -------------------------------
# Omarchy's Hyprland windowrules float dialogs, settings and media players
# rather than tiling them. All bundle IDs below were read from the installed
# .app bundles, not guessed.

# Settings & system utilities
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'      # System Settings
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.SystemProfiler'         # System Information
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.DiskUtility'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.keychainaccess'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.AppStore'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.archiveutility'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.FontBook'
run = 'layout floating'

# Media players — tiling a video window is never what you want
[[on-window-detected]]
if.app-id = 'com.colliderli.iina'              # IINA
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.QuickTimePlayerX'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'io.mpv'                           # mpv (stolendata cask)
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'no.mifi.losslesscut-mac'          # LosslessCut
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Photos'
run = 'layout floating'

# Input/remapping & launcher UIs
[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-Elements.Settings'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-EventViewer'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.localsend.localsendApp'       # share sheet equivalent
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.docker.docker'
run = 'layout floating'

# Dialog-ish windows of otherwise-tiled apps
[[on-window-detected]]
if.app-id = 'com.apple.finder'
if.window-title-regex-substring = 'Info|Copy|Move|Delete|Preferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.1password.1password'
if.window-title-regex-substring = 'Quick Access'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Preview'
if.window-title-regex-substring = 'Info|Open|Export'
run = 'layout floating'

# Anything whose title looks like a modal
[[on-window-detected]]
if.window-title-regex-substring = 'Preferences|Settings…|About '
run = 'layout floating'
