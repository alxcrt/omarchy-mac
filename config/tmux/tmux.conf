# ~/.config/tmux/tmux.conf
# Fresh default. To match your Linux setup, rsync it over and strip any
# run-shell lines that call omarchy-* binaries (they don't exist on macOS):
#   rsync -a linuxbox:~/.config/tmux/ ~/.config/tmux/
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 100000

# Prefix stays C-b. Reload config with prefix + r.
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Split panes with | and - , keeping cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
